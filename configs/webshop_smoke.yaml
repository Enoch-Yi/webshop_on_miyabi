env:
  observation_mode: text
  num_products: 1000
  human_goals: true
  products_file: null
  attr_file: null
  train_goal_start: 0
  train_goal_end: 10
  eval_goal_start: 10
  eval_goal_end: 13
  max_steps: 2

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  max_prompt_length: 512
  max_response_tokens: 32
  history_length: 1
  gen_temperature: 0.8
  eval_temperature: 0.4
  top_p: 0.95

training:
  seed: 42
  total_epochs: 1
  eval_every: 1
  eval_games: 2
  train_data_size: 1
  group_size: 2
  lr: 1.0e-6
  beta_kl: 0.0
  invalid_action_penalty: -0.1
  success_reward: 10.0
  max_train_steps: 2
  top_m_actions: 0
  save_dir: "./runs/smoke_train"

algorithm:
  name: grpo
  w_base: 1.0
  w_br: 1.0
  w_dpo: 0.0
  B: 1  # per-task branching budget
  K: 1
  lambda_u: 1.0
  lambda_i: 1.0
  beta_dpo: 0.1
  lambda_br: 1.0
  gamma_dpo: 1.0
  state_selection_mode: top_k
  action_pair_mode: cdb
  tau_s: null
  cdb_p: 64
  cdb_eta: 1.0
  cdb_mu: 0.1
  cdb_delta: 0.01
  cdb_sigma0: 1.0

logging:
  jsonl_name: "log.jsonl"
  console_log: true
  prompt_response_log: true
  prompt_response_max_bytes: 500000
  wandb_enabled: false
  wandb_project: "webshop_on_miyabi_ai_ready"
  wandb_name: "smoke_train"
  wandb_group: null
  wandb_entity: null
  wandb_mode: "disabled"
  wandb_tags: ["smoke"]
